  - id: wikipedia
    name: Wikipedia
    publisher: Wikimedia Foundation
    url: https://en.wikipedia.org
    license: CC BY-SA 4.0 (facts about who holds an office are not copyrightable; cited as the source)
    attribution: "Current office-holder lists: Wikipedia, citing the sources named per row"
  - id: curated
    name: Unnati Index curated tables
    publisher: Unnati Index contributors
    url: https://github.com/Agneeshz/unnati-index/tree/main/pipeline/src/unnati/manual
    license: CC BY 4.0 (our transcription; original publisher terms apply to the data)
    attribution: "Transcribed by Unnati Index from the official publication cited per row"

