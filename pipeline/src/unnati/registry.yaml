# Every data source and dataset Unnati Index uses. `unnati seed` syncs this file into the
# `source` and `dataset` tables. A dataset stays `enabled: false` (status "paused") until its
# connector exists and has tests. Landing URLs point at publisher home pages until each
# connector is built and its exact source page is verified.

sources:
  - id: rbi
    name: Reserve Bank of India
    publisher: Reserve Bank of India
    url: https://www.rbi.org.in
    license: Government publication — reproduced with attribution
    attribution: "Source: Reserve Bank of India"
  - id: mospi
    name: National Statistics Office (MoSPI)
    publisher: Ministry of Statistics and Programme Implementation
    url: https://www.mospi.gov.in
    license: Government publication — reproduced with attribution
    attribution: "Source: National Statistics Office, MoSPI"
