# Maintainer decisions for office-holder terms imported from Wikidata.
#
# `uv run unnati officials sync --dry-run` lists every term held for review with its id.
# Settle one here, citing an official source (a President's Secretariat communique, All India
# Radio, a gazette notification, the state government's website). Every entry needs
# `source_url`; the rest is optional:
#
# "wikidata:<statement-id>:<entity-slug>":
#   party: Q234277            # Wikidata QID of the correct party (elected offices only)
#   party_label: Communist Party of India (Marxist)
#   person_name: Ramesh Bais  # fixes a missing or vandalised Wikidata label
#   start: 2021-05-20
#   end: 2026-05-18           # setting an end date settles "possibly out of date"
#   source_url: https://...
#   note: why this decision was made
#   reviewed: true            # clears remaining review notes; leave out to keep them
#
# New office-holders that Wikidata does not have yet go in officials.yaml instead.
# Verified 2026-10-03.

