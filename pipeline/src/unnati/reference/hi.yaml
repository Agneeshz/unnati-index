# Hindi text for the data shown on the site: indicator names, descriptions, units and caveats,
# category descriptions and the thematic indices. `unnati seed` loads it into the *_hi columns;
# anything missing falls back to English. Acronyms of official sources (PLFS, NFHS, SRS, NCRB,
# UDISE+, CPCB, HCES) are kept as published.

units:
  "%": "%"
  "% correct": "% सही"
  "% of GSDP": "% (GSDP का)"
  "% of capacity": "% (क्षमता का)"
  "% of expenditure": "% (व्यय का)"
  "% of households": "% (परिवारों का)"
  "% of pending cases": "% (लंबित मामलों का)"
  "% of population": "% (जनसंख्या का)"
  "% of requirement": "% (आवश्यकता का)"
  "% of rural households": "% (ग्रामीण परिवारों का)"
  "% of sanctioned posts": "% (स्वीकृत पदों का)"
  "% of schools": "% (स्कूलों का)"
  "% of waste generated": "% (उत्पन्न कचरे का)"
  "% of workers": "% (कामगारों का)"
  "AQI": "AQI"
  "US$ million": "मिलियन US$"
  "US$ per person": "US$ प्रति व्यक्ति"
  "children per woman": "बच्चे प्रति महिला"
  "girls per 1,000 boys": "लड़कियाँ प्रति 1,000 लड़के"
  "index (0–1)": "सूचकांक (0–1)"
  "kWh per person": "kWh प्रति व्यक्ति"
  "km per 1,000 km²": "किमी प्रति 1,000 वर्ग किमी"
  "km per 100 km²": "किमी प्रति 100 वर्ग किमी"
  "per 1,00,000 live births": "प्रति 1,00,000 जीवित जन्म"
  "per 1,000 live births": "प्रति 1,000 जीवित जन्म"
  "per 1,000 people": "प्रति 1,000 लोग"
  "per 1,000 working-age people": "प्रति 1,000 कामकाजी आयु के लोग"
  "per 100 people": "प्रति 100 लोग"
  "per 100 people per year": "प्रति 100 लोग प्रति वर्ष"
  "per lakh children": "प्रति लाख बच्चे"
  "per lakh population": "प्रति लाख जनसंख्या"
  "per lakh women": "प्रति लाख महिलाएँ"
  "persons": "व्यक्ति"
  "pupils per teacher": "छात्र प्रति शिक्षक"
  "transactions per person per year": "लेन-देन प्रति व्यक्ति प्रति वर्ष"
  "years": "वर्ष"
  "µg/m³": "µg/m³"
  "₹": "₹"
  "₹ crore": "₹ करोड़"
  "₹ per month": "₹ प्रति माह"
  "₹ per person": "₹ प्रति व्यक्ति"

# Shared caveats, referenced below with *anchors.
_caveats:
  crime: &crime "दर्ज अपराध इस पर निर्भर करते हैं कि लोग कितनी आसानी से शिकायत दर्ज करा पाते हैं। ऊँची दर बेहतर रिपोर्टिंग का संकेत भी हो सकती है, ज़रूरी नहीं कि अपराध ज़्यादा हों।"
  density: &density "जम्मू-कश्मीर और लद्दाख के लिए नहीं निकाला गया, क्योंकि उनके आधिकारिक क्षेत्रफल में वह क्षेत्र भी शामिल है जिस पर भारत का दावा है पर प्रशासन नहीं। छोटे, शहरी केंद्र शासित प्रदेश (दिल्ली, चंडीगढ़) राज्यों से बहुत ऊपर दिखते हैं।"
  parakh: &parakh "दिसंबर 2024 में लगभग 21 लाख छात्रों का नमूना सर्वेक्षण, NCERT की राज्य रिपोर्टों से। दादरा और नगर हवेली तथा दमन और दीव की रिपोर्ट नहीं मिली।"

indicators:
  population:
    name: जनसंख्या
    description: वर्ष के मध्य की अनुमानित जनसंख्या।
  population-working-age:
    name: कामकाजी आयु की जनसंख्या (15–59)
    description: 15–59 वर्ष आयु की, वर्ष के मध्य की अनुमानित जनसंख्या।
  total-fertility-rate:
    name: कुल प्रजनन दर
    description: मौजूदा आयु-विशिष्ट प्रजनन दरों पर एक महिला के जीवनकाल में होने वाले बच्चों की औसत संख्या।
  gsdp-current:
    name: सकल राज्य घरेलू उत्पाद (वर्तमान मूल्य)
    description: राज्य में उत्पादित सभी वस्तुओं और सेवाओं का मूल्य, वर्तमान मूल्यों पर।
  gsdp-constant:
    name: सकल राज्य घरेलू उत्पाद (स्थिर मूल्य)
    description: आधार वर्ष के स्थिर मूल्यों पर वास्तविक GSDP।
    caveat: आधार वर्ष बदलने से शृंखला टूटती है; अलग-अलग आधार वर्षों के आँकड़े कभी मिलाए नहीं जाते।
  per-capita-nsdp-constant:
    name: प्रति व्यक्ति आय (वास्तविक)
    description: स्थिर मूल्यों पर प्रति व्यक्ति शुद्ध राज्य घरेलू उत्पाद।
  per-capita-nsdp-current:
    name: प्रति व्यक्ति आय (वर्तमान मूल्य)
    description: वर्तमान मूल्यों पर प्रति व्यक्ति शुद्ध राज्य घरेलू उत्पाद।
    caveat: महँगाई के लिए समायोजित नहीं; समय के साथ तुलना के लिए स्थिर मूल्य वाली शृंखला देखें।
  gsdp-growth-real:
    name: वास्तविक GSDP वृद्धि
    description: स्थिर मूल्यों पर सकल राज्य घरेलू उत्पाद की वार्षिक वृद्धि।
  gsdp-growth-real-3yr:
    name: वास्तविक GSDP वृद्धि (3 वर्ष का औसत)
    description: पिछले तीन वर्षों में वास्तविक GSDP की औसत वार्षिक वृद्धि।
  cpi-inflation:
    name: खुदरा महँगाई (CPI, संयुक्त)
    description: उपभोक्ता मूल्य सूचकांक (ग्रामीण + शहरी) में वर्ष-दर-वर्ष बदलाव।
  unemployment-rate:
    name: बेरोज़गारी दर
    description: श्रम बल (15+ आयु) में से बिना काम वाले लोगों का हिस्सा, सामान्य स्थिति (PS+SS), कैलेंडर वर्ष (PLFS)।
  youth-unemployment-rate:
    name: युवा बेरोज़गारी दर
    description: 15–29 आयु के श्रम बल में से बिना काम वाले लोगों का हिस्सा, सामान्य स्थिति (PS+SS), कैलेंडर वर्ष (PLFS)।
  lfpr:
    name: श्रम बल भागीदारी दर
    description: 15+ आयु के उन लोगों का हिस्सा जो काम कर रहे हैं या काम खोज रहे हैं, सामान्य स्थिति (PS+SS), कैलेंडर वर्ष (PLFS)।
  epfo-net-payroll-per-1000:
    name: प्रति 1,000 कामकाजी आयु के लोगों पर नई औपचारिक नौकरियाँ
    description: वर्ष में EPFO पेरोल में शुद्ध वृद्धि, 15–59 आयु के प्रति 1,000 लोगों पर।
    caveat: केवल औपचारिक क्षेत्र के नामांकन गिने जाते हैं; प्रतिष्ठान अपने मुख्यालय वाले राज्य में पंजीकरण कराते हैं, इसलिए कुछ राज्यों में संख्या ज़्यादा दिख सकती है।
  regular-wage-share:
    name: नियमित वेतन वाली नौकरियों में कामगार
    description: कामगारों (सामान्य स्थिति) में से नियमित वेतन या तनख़्वाह वाले रोज़गार में लगे लोगों का हिस्सा, स्वरोज़गार या आकस्मिक मज़दूरी के बजाय।
    caveat: नियमित नौकरी हमेशा अच्छी नौकरी नहीं होती; PLFS के अनुसार कई नियमित कर्मचारियों के पास लिखित अनुबंध या सामाजिक सुरक्षा नहीं है।
  mpce-rural:
    name: मासिक प्रति व्यक्ति उपभोग (ग्रामीण)
    description: ग्रामीण परिवारों का औसत मासिक प्रति व्यक्ति उपभोग व्यय (HCES)।
  mpce-urban:
    name: मासिक प्रति व्यक्ति उपभोग (शहरी)
    description: शहरी परिवारों का औसत मासिक प्रति व्यक्ति उपभोग व्यय (HCES)।
  merchandise-exports:
    name: वस्तु निर्यात
    description: निर्यात की गई वस्तुओं का मूल्य, मूल राज्य के अनुसार।
  exports-per-capita:
    name: प्रति व्यक्ति वस्तु निर्यात
    description: मूल राज्य के अनुसार वार्षिक वस्तु निर्यात, जनसंख्या से भाग देकर।
    caveat: मूल राज्य वही है जो शिपिंग बिल में घोषित है। सेवाओं का निर्यात राज्य-वार प्रकाशित नहीं होता।
  merchandise-exports-growth:
    name: वस्तु निर्यात वृद्धि
    description: मूल राज्य के अनुसार वस्तु निर्यात में वर्ष-दर-वर्ष वृद्धि।
  merchandise-imports:
    name: वस्तु आयात
    description: आयात की गई वस्तुओं का मूल्य, DGCI&S द्वारा दर्ज राज्य के अनुसार।
    caveat: आयात का राज्य-वार बँटवारा अधूरा है; DGCI&S इसे डेटा की ज्ञात सीमा बताता है।
  gst-collection-per-capita:
    name: प्रति व्यक्ति GST संग्रह
    description: चालू वित्त वर्ष में अब तक राज्य का GST राजस्व (SGST और राज्य को निपटाए गए IGST का SGST हिस्सा), प्रति व्यक्ति।
  gst-collection-growth:
    name: GST संग्रह वृद्धि
    description: चालू वित्त वर्ष में अब तक राज्य के GST राजस्व (निपटान के बाद SGST) में, पिछले वर्ष के उन्हीं महीनों की तुलना में वृद्धि।
  digital-payments-per-capita:
    name: प्रति व्यक्ति डिजिटल भुगतान (PhonePe)
    description: पिछली चार तिमाहियों में PhonePe लेन-देन, जनसंख्या से भाग देकर।
    caveat: केवल एक भुगतान ऐप शामिल है; उसकी बाज़ार हिस्सेदारी राज्यों में अलग है, इसलिए इसे अनुमानित संकेत मानें।
  fiscal-deficit-pct-gsdp:
    name: राजकोषीय घाटा
    description: राज्य सरकार का सकल राजकोषीय घाटा, GSDP के हिस्से के रूप में।
  debt-pct-gsdp:
    name: बकाया कर्ज़
    description: राज्य सरकार की बकाया देनदारियाँ, GSDP के हिस्से के रूप में।
  own-tax-revenue-pct-gsdp:
    name: अपना कर राजस्व
    description: राज्य का अपना कर राजस्व, GSDP के हिस्से के रूप में।
  capex-share:
    name: पूँजीगत व्यय का हिस्सा
    description: कुल राज्य व्यय में पूँजीगत परिव्यय का हिस्सा।
  court-cases-pending-over-5y:
    name: 5 साल से अधिक समय से लंबित अदालती मामले
    description: ज़िला और अधीनस्थ अदालतों में लंबित मामलों में से पाँच साल से पुराने मामलों का हिस्सा।
  police-vacancy:
    name: पुलिस रिक्तियाँ
    description: स्वीकृत पुलिस पदों में से खाली पदों का हिस्सा।
    caveat: केवल राज्य पुलिस (नागरिक, ज़िला सशस्त्र रिज़र्व, सशस्त्र पुलिस और IRB), 1 जनवरी की स्थिति। शून्य से कम का अर्थ है स्वीकृत पदों से अधिक कर्मी।
  murder-rate:
    name: हत्या दर
    description: प्रति लाख जनसंख्या पर दर्ज हत्याएँ।
    caveat: समग्र सूचकांक में इसका उपयोग इसलिए होता है क्योंकि हत्या वह अपराध है जिस पर कम रिपोर्टिंग का असर सबसे कम पड़ता है।
  crime-rate-total:
    name: कुल संज्ञेय अपराध दर
    description: प्रति लाख जनसंख्या पर दर्ज संज्ञेय अपराध (IPC/BNS तथा विशेष और स्थानीय क़ानून)।
    caveat: *crime
  crimes-against-women-rate:
    name: महिलाओं के विरुद्ध अपराध
    description: प्रति लाख महिला जनसंख्या पर दर्ज महिलाओं के विरुद्ध अपराध।
    caveat: *crime
  crimes-against-children-rate:
    name: बच्चों के विरुद्ध अपराध
    description: प्रति लाख बाल जनसंख्या पर दर्ज बच्चों के विरुद्ध अपराध।
    caveat: "दर्ज अपराध इस पर निर्भर करते हैं कि लोग कितनी आसानी से शिकायत दर्ज करा पाते हैं। ऊँची दर बेहतर रिपोर्टिंग का संकेत भी हो सकती है। NCRB 2011 की जनगणना की बाल जनसंख्या से भाग देता है, इसलिए जहाँ बच्चों की संख्या तब से बदली है वहाँ दर खिसक जाती है।"
  cybercrime-rate:
    name: साइबर अपराध दर
    description: प्रति लाख जनसंख्या पर दर्ज साइबर अपराध।
    caveat: *crime
  conviction-rate:
    name: दोषसिद्धि दर
    description: वर्ष में पूरे हुए IPC/BNS मुक़दमों में से दोषसिद्धि पर ख़त्म हुए मुक़दमों का हिस्सा।
  trial-pendency:
    name: लंबित आपराधिक मुक़दमे
    description: वर्ष के अंत में सुनवाई के लिए लंबित IPC/BNS मामले, उस वर्ष अदालतों में सुनवाई वाले सभी मामलों के हिस्से के रूप में।
    caveat: केवल आपराधिक मुक़दमों का बकाया मापता है, दीवानी मामलों का नहीं।
  chargesheeting-rate:
    name: आरोप-पत्र दर
    description: पुलिस द्वारा निपटाए गए IPC/BNS मामलों में से जिनमें आरोप-पत्र दाखिल हुआ, उनका हिस्सा।
  air-passengers-per-100:
    name: प्रति 100 लोगों पर हवाई यात्री
    description: राज्य के हवाई अड्डों पर यात्री (आने और जाने वाले, घरेलू और अंतरराष्ट्रीय), प्रति वर्ष प्रति 100 निवासी।
    caveat: राज्य के हवाई अड्डों पर संभाले गए यातायात की गिनती है, इसलिए पड़ोसी राज्यों और पर्यटकों को सेवा देने वाले केंद्र (दिल्ली, गोवा) निवासियों की वास्तविक उड़ानों से बहुत ऊपर दिखते हैं।
  vehicles-per-1000:
    name: प्रति 1,000 लोगों पर पंजीकृत मोटर वाहन
    description: प्रति 1,000 लोगों पर पंजीकृत मोटर वाहन (परिवहन और गैर-परिवहन)।
    caveat: पंजीकरण जुड़ते जाते हैं और पुराने वाहन शायद ही हटाए जाते हैं, इसलिए यह सड़क पर चल रहे वाहनों को बढ़ा-चढ़ाकर दिखाता है।
  road-density:
    name: सड़क घनत्व
    description: प्रति 100 वर्ग किमी क्षेत्रफल पर सभी सड़कों (राष्ट्रीय और राज्य राजमार्ग, ज़िला, ग्रामीण, शहरी और परियोजना सड़कें) की लंबाई।
    caveat: *density
  national-highway-density:
    name: राष्ट्रीय राजमार्ग घनत्व
    description: प्रति 1,000 वर्ग किमी क्षेत्रफल पर राष्ट्रीय राजमार्गों की लंबाई।
    caveat: *density
  state-highway-density:
    name: राज्य राजमार्ग घनत्व
    description: प्रति 1,000 वर्ग किमी क्षेत्रफल पर राज्य राजमार्गों की लंबाई।
    caveat: *density
  rail-route-density:
    name: रेल मार्ग घनत्व
    description: प्रति 1,000 वर्ग किमी क्षेत्रफल पर रेल मार्ग की लंबाई।
    caveat: *density
  road-deaths-per-lakh:
    name: सड़क दुर्घटनाओं में मौतें
    description: प्रति लाख जनसंख्या पर सड़क दुर्घटनाओं में मौतें।
  suicide-rate:
    name: आत्महत्या दर
    description: प्रति लाख जनसंख्या पर आत्महत्याएँ।
  infant-mortality-rate:
    name: शिशु मृत्यु दर
    description: प्रति 1,000 जीवित जन्मों पर एक वर्ष से कम आयु के शिशुओं की मौतें।
  under5-mortality-rate:
    name: 5 वर्ष से कम आयु में मृत्यु दर
    description: प्रति 1,000 जीवित जन्मों पर पाँच वर्ष से कम आयु के बच्चों की मौतें।
  maternal-mortality-ratio:
    name: मातृ मृत्यु अनुपात
    description: प्रति 1,00,000 जीवित जन्मों पर मातृ मौतें (तीन वर्ष का SRS अनुमान)।
    caveat: केवल बड़े राज्यों के लिए प्रकाशित; छोटे राज्य संयुक्त समूहों में दिए जाते हैं।
  life-expectancy:
    name: जन्म के समय जीवन प्रत्याशा
    description: मौजूदा मृत्यु दरों पर एक नवजात के जीने के औसत अपेक्षित वर्ष (SRS संक्षिप्त जीवन तालिकाएँ, पाँच वर्ष की अवधि)।
  stunting-under5:
    name: 5 वर्ष से कम आयु के ठिगने बच्चे
    description: पाँच वर्ष से कम आयु के उन बच्चों का हिस्सा जिनकी लंबाई उम्र के हिसाब से कम है (NFHS)।
  anaemia-women:
    name: महिलाओं में एनीमिया
    description: 15–49 आयु की एनीमिया से ग्रस्त महिलाओं का हिस्सा (NFHS)।
    caveat: समय के साथ तुलना से पहले देख लें कि NFHS के दौरों के बीच मापने का तरीका बदला तो नहीं।
  anaemia-children:
    name: छोटे बच्चों में एनीमिया
    description: 6–59 महीने के एनीमिया से ग्रस्त बच्चों का हिस्सा (NFHS)।
  full-immunisation:
    name: पूर्ण टीकाकरण वाले बच्चे
    description: 12–23 महीने के उन बच्चों का हिस्सा जिन्हें सभी बुनियादी टीके लगे (NFHS)।
  institutional-births:
    name: संस्थागत प्रसव
    description: पिछले पाँच वर्षों के जन्मों में से स्वास्थ्य केंद्र में हुए जन्मों का हिस्सा (NFHS)।
  ger-secondary:
    name: सकल नामांकन अनुपात, माध्यमिक
    description: कक्षा 9–10 में नामांकन, उन कक्षाओं की आधिकारिक आयु वाली जनसंख्या के हिस्से के रूप में।
    caveat: अधिक या कम आयु के बच्चों के नामांकन से यह 100% से ऊपर जा सकता है।
  dropout-secondary:
    name: पढ़ाई छोड़ने की दर, माध्यमिक
    description: माध्यमिक स्तर (कक्षा 9–10) पर पढ़ाई छोड़ने की औसत वार्षिक दर।
  ptr-secondary:
    name: छात्र–शिक्षक अनुपात, माध्यमिक
    description: माध्यमिक स्तर पर प्रति शिक्षक छात्र।
  schools-with-internet:
    name: इंटरनेट वाले स्कूल
    description: चालू इंटरनेट कनेक्शन वाले स्कूलों का हिस्सा।
    caveat: MoSPI के UDISE+ API में प्रकाशित नहीं; समग्र सूचकांक में इसके बजाय कंप्यूटर वाले स्कूल लिए जाते हैं।
  schools-with-computers:
    name: कंप्यूटर वाले स्कूल
    description: चालू डेस्कटॉप कंप्यूटर वाले स्कूलों का हिस्सा (UDISE+, सभी प्रबंधन)।
  schools-with-electricity:
    name: बिजली वाले स्कूल
    description: चालू बिजली वाले स्कूलों का हिस्सा (UDISE+, सभी प्रबंधन)।
  schools-with-girls-toilets:
    name: लड़कियों के चालू शौचालय वाले स्कूल
    description: लड़कियों के चालू शौचालय वाले स्कूलों का हिस्सा (UDISE+, सभी प्रबंधन)।
  parakh-grade6-maths:
    name: कक्षा 6 गणित प्रदर्शन (PARAKH)
    description: परख राष्ट्रीय सर्वेक्षण (राष्ट्रीय अधिगम सर्वेक्षण) में कक्षा 6 के छात्रों द्वारा सही उत्तर दिए गए गणित प्रश्नों का औसत प्रतिशत।
    caveat: *parakh
  parakh-grade3:
    name: कक्षा 3 अधिगम स्तर (PARAKH)
    description: परख राष्ट्रीय सर्वेक्षण में भाषा और गणित में कक्षा 3 के छात्रों द्वारा सही उत्तर दिए गए प्रश्नों का औसत प्रतिशत।
  parakh-grade6:
    name: कक्षा 6 अधिगम स्तर (PARAKH)
    description: परख राष्ट्रीय सर्वेक्षण में भाषा, गणित और "हमारे आसपास की दुनिया" में कक्षा 6 के छात्रों द्वारा सही उत्तर दिए गए प्रश्नों का औसत प्रतिशत।
  parakh-grade9:
    name: कक्षा 9 अधिगम स्तर (PARAKH)
    description: परख राष्ट्रीय सर्वेक्षण में भाषा, गणित, विज्ञान और सामाजिक विज्ञान में कक्षा 9 के छात्रों द्वारा सही उत्तर दिए गए प्रश्नों का औसत प्रतिशत।
  parakh-learning:
    name: अधिगम परिणाम (PARAKH)
    description: परख राष्ट्रीय सर्वेक्षण में कक्षा 3, 6 और 9 के अधिगम स्तरों का औसत (सभी परीक्षित विषयों में सही उत्तर दिए गए प्रश्नों का औसत %)।
    caveat: *parakh
  ger-higher-education:
    name: सकल नामांकन अनुपात, उच्च शिक्षा
    description: उच्च शिक्षा में नामांकन, 18–23 आयु की जनसंख्या के हिस्से के रूप में।
  tap-water-households:
    name: नल के पानी वाले ग्रामीण परिवार
    description: चालू घरेलू नल कनेक्शन वाले ग्रामीण परिवारों का हिस्सा।
  electricity-per-capita:
    name: प्रति व्यक्ति बिजली खपत
    description: प्रति व्यक्ति प्रति वर्ष उपलब्ध बिजली (CEA, प्रति व्यक्ति उपलब्धता)।
  energy-deficit:
    name: बिजली की कमी
    description: ऊर्जा आवश्यकता में से आपूर्ति न हो सकी ऊर्जा का हिस्सा।
  clean-cooking-fuel:
    name: स्वच्छ रसोई ईंधन इस्तेमाल करने वाले परिवार
    description: खाना पकाने के लिए मुख्य रूप से स्वच्छ ईंधन (LPG, प्राकृतिक गैस, बिजली, बायोगैस) इस्तेमाल करने वाले परिवारों का हिस्सा (NFHS)।
  households-with-electricity:
    name: बिजली वाले परिवार
    description: बिजली वाले घरों में रहने वाली जनसंख्या का हिस्सा (NFHS)।
  improved-sanitation:
    name: बेहतर स्वच्छता वाले परिवार
    description: बेहतर स्वच्छता सुविधा इस्तेमाल करने वाले परिवारों का हिस्सा (NFHS)।
  internet-subscribers-per-100:
    name: प्रति 100 लोगों पर इंटरनेट ग्राहक
    description: प्रति 100 जनसंख्या पर इंटरनेट कनेक्शन।
    caveat: कनेक्शन गिने जाते हैं (एक व्यक्ति के कई हो सकते हैं) और जहाँ वे पंजीकृत हैं वहाँ गिने जाते हैं, इसलिए दिल्ली और गोवा जैसे राज्य, जहाँ बहुत से आगंतुक और प्रवासी कामगार हैं, ऊँचे दिखते हैं।
  aqi-daily-mean:
    name: औसत वायु गुणवत्ता सूचकांक (दैनिक)
    description: CPCB के दैनिक बुलेटिन में राज्य के शहरों का उस दिन का औसत AQI (शाम 4 बजे का 24 घंटे का औसत)।
    caveat: केवल निगरानी वाले शहर शामिल हैं; कई ज़िलों में कोई सतत निगरानी केंद्र नहीं है।
  pm25-annual:
    name: वार्षिक PM2.5 सांद्रता
    description: राज्य के निगरानी वाले शहरों में वार्षिक औसत PM2.5 (जहाँ सतत मॉनिटर हैं वहाँ उनसे, नहीं तो मैनुअल केंद्रों से), शहरों का औसत।
    caveat: केवल निगरानी वाले शहर शामिल हैं, इसलिए एक ही निगरानी वाले शहर वाले राज्य का आकलन उसी शहर से होता है। राष्ट्रीय मानक 40 µg/m³ प्रति वर्ष है; WHO का दिशानिर्देश 5 है।
  forest-cover-change:
    name: वन क्षेत्र में बदलाव
    description: पिछली भारत वन स्थिति रिपोर्ट के बाद से वन क्षेत्र में बदलाव।
  renewable-share-capacity:
    name: बिजली क्षमता में नवीकरणीय हिस्सा
    description: स्थापित बिजली क्षमता में ग्रिड से जुड़ी नवीकरणीय क्षमता (सौर, पवन, लघु जल, जैव-ऊर्जा; बड़ी जल परियोजनाएँ छोड़कर) का हिस्सा।
    caveat: यह आंशिक रूप से प्राकृतिक संसाधनों (धूप, हवा, नदियाँ) पर निर्भर है, केवल नीति पर नहीं।
  groundwater-extraction-stage:
    name: भूजल दोहन का स्तर
    description: वार्षिक भूजल दोहन, निकाले जा सकने वाले भूजल संसाधनों के हिस्से के रूप में।
  waste-processed:
    name: संसाधित शहरी ठोस कचरा
    description: हर दिन उत्पन्न नगरपालिका ठोस कचरे में से उपचारित कचरे का हिस्सा (CPCB वार्षिक रिपोर्ट, EnviStats के माध्यम से)।
  mpi-headcount:
    name: बहुआयामी गरीबी
    description: बहुआयामी रूप से गरीब जनसंख्या का हिस्सा (राष्ट्रीय MPI)।
  sex-ratio-at-birth:
    name: जन्म के समय लिंगानुपात
    description: प्रति 1,000 लड़कों पर जन्मी लड़कियाँ (तीन वर्ष का SRS औसत)।
    caveat: जन्म के समय प्राकृतिक लिंगानुपात लगभग 950 लड़कियाँ प्रति 1,000 लड़के है, इसलिए उससे ऊपर के मान "बेहतर" नहीं हैं।
  sex-ratio-at-birth-nfhs:
    name: जन्म के समय लिंगानुपात (NFHS)
    description: सर्वेक्षण से पहले के पाँच वर्षों में जन्मे बच्चों में प्रति 1,000 लड़कों पर लड़कियाँ (NFHS); हर राज्य और केंद्र शासित प्रदेश शामिल।
    caveat: छोटे राज्यों और केंद्र शासित प्रदेशों में बड़े अंतर वाला सर्वेक्षण अनुमान। जहाँ SRS आँकड़े प्रकाशित हैं, उन्हें प्राथमिकता दी जाती है।
  female-lfpr:
    name: महिला श्रम बल भागीदारी
    description: 15+ आयु की उन महिलाओं का हिस्सा जो काम कर रही हैं या काम खोज रही हैं, सामान्य स्थिति (PS+SS), कैलेंडर वर्ष (PLFS)।
  women-bank-account:
    name: स्वयं इस्तेमाल किए जाने वाले बैंक खाते वाली महिलाएँ
    description: 15–49 आयु की उन महिलाओं का हिस्सा जिनका बैंक या बचत खाता है जिसे वे ख़ुद इस्तेमाल करती हैं (NFHS)।
  child-marriage:
    name: बाल विवाह
    description: 20–24 आयु की उन महिलाओं का हिस्सा जिनकी शादी 18 वर्ष से पहले हुई (NFHS)।
  consumption-gini:
    name: उपभोग असमानता (गिनी)
    description: मासिक प्रति व्यक्ति उपभोग व्यय के ग्रामीण और शहरी गिनी गुणांकों का औसत (HCES); 0 पूर्ण समानता है।
    caveat: MoSPI ग्रामीण और शहरी गिनी अलग-अलग प्रकाशित करता है; यह औसत पूरे राज्य का गिनी नहीं है, क्योंकि इसमें ग्रामीण और शहरी उपभोग का अंतर शामिल नहीं होता।
  consumption-gini-rural:
    name: उपभोग असमानता, ग्रामीण (गिनी)
    description: ग्रामीण क्षेत्रों में मासिक प्रति व्यक्ति उपभोग व्यय का गिनी गुणांक (HCES, मुफ़्त वस्तुओं के अनुमानित मूल्य के बिना)।
  consumption-gini-urban:
    name: उपभोग असमानता, शहरी (गिनी)
    description: शहरी क्षेत्रों में मासिक प्रति व्यक्ति उपभोग व्यय का गिनी गुणांक (HCES, मुफ़्त वस्तुओं के अनुमानित मूल्य के बिना)।

indices:
  human-development:
    name: मानव विकास सूचकांक (उन्नति अनुमान)
    description: लंबा और स्वस्थ जीवन, ज्ञान और सम्मानजनक जीवन-स्तर, UNDP के HDI के तरीके से जोड़े गए।
    inspired_by: UNDP मानव विकास सूचकांक
    method: "UNDP जैसे स्थिर लक्ष्य-बिंदुओं वाले तीन आयाम सूचकांक: जन्म के समय जीवन प्रत्याशा (20 से 85 वर्ष); ज्ञान, जिसमें स्कूली शिक्षा के वर्षों की जगह माध्यमिक और उच्च शिक्षा नामांकन (0 से 100%); और आय, स्थिर मूल्यों पर प्रति व्यक्ति NSDP का लघुगणक (₹10,000 से ₹5,00,000)। सूचकांक इनका ज्यामितीय माध्य है, इसलिए एक कमज़ोर आयाम की भरपाई मज़बूत आयाम से नहीं हो सकती। 0 से 100 पर (UNDP 0 से 1 पर प्रकाशित करता है)।"
    caveat: UNDP के प्रकाशित HDI से तुलनीय नहीं, जो स्कूली शिक्षा के वर्ष और अंतरराष्ट्रीय डॉलर में आय इस्तेमाल करता है। केवल SRS जीवन तालिकाओं वाले राज्य शामिल हैं।
    dimensions: {Health: स्वास्थ्य, Income: आय, Knowledge: ज्ञान}
  social-progress:
    name: सामाजिक प्रगति सूचकांक
    description: राज्य अपने लोगों की ज़रूरतें कितनी अच्छी तरह पूरी करता है, केवल परिणामों से मापा गया, आय या ख़र्च से कभी नहीं।
    inspired_by: Social Progress Imperative का सामाजिक प्रगति सूचकांक
    method: "बराबर भार वाले तीन आयाम: बुनियादी मानवीय ज़रूरतें (स्वच्छता, बिजली, स्वच्छ रसोई ईंधन, शिशु जीवन, बाल पोषण), कल्याण की नींव (माध्यमिक नामांकन, इंटरनेट पहुँच, जीवन प्रत्याशा, भूजल दबाव), और अवसर (महिलाओं के बैंक खाते, बाल विवाह, महिलाओं का काम, महिलाओं की सुरक्षा, उच्च शिक्षा)।"
    dimensions: {Basic human needs: बुनियादी मानवीय ज़रूरतें, Foundations of well-being: कल्याण की नींव, Opportunity: अवसर}
  safety:
    name: सुरक्षा सूचकांक
    description: लोग हिंसा, अपराध और सड़कों पर रोकी जा सकने वाली मौतों से कितने सुरक्षित हैं।
    inspired_by: वैश्विक शांति सूचकांक (केवल घरेलू सुरक्षा)
    method: "छह स्कोर का माध्य: हत्या दर, कुल संज्ञेय अपराध दर, महिलाओं के विरुद्ध अपराध, बच्चों के विरुद्ध अपराध, सड़क दुर्घटनाओं में मौतें और आत्महत्याएँ, सभी प्रति लाख लोगों पर। वैश्विक शांति सूचकांक के विपरीत, इसमें सैन्यीकरण या संघर्ष के माप नहीं हैं, जो राज्यों पर लागू नहीं होते।"
    caveat: दर्ज अपराध इस पर निर्भर करते हैं कि लोग कितनी आसानी से शिकायत दर्ज करा पाते हैं; बेहतर रिपोर्टिंग वाला राज्य कम सुरक्षित दिख सकता है। हत्या दर पर इसका असर सबसे कम है।
    dimensions: {Safety: सुरक्षा}
  gender-equality:
    name: लैंगिक समानता सूचकांक
    description: महिलाओं की आर्थिक भागीदारी, स्वायत्तता, स्वास्थ्य और सुरक्षा।
    inspired_by: UNDP लैंगिक असमानता सूचकांक और नीति आयोग SDG 5
    method: "बराबर भार वाले तीन आयाम: आर्थिक (महिलाओं की श्रम बल भागीदारी, महिलाओं के अपने बैंक खाते), स्वास्थ्य और स्वायत्तता (महिलाओं में एनीमिया, बाल विवाह, जन्म के समय लिंगानुपात), और सुरक्षा (महिलाओं के विरुद्ध अपराध)।"
    dimensions: {Economic: आर्थिक, Health and autonomy: स्वास्थ्य और स्वायत्तता, Safety: सुरक्षा}
  child-wellbeing:
    name: बाल कल्याण सूचकांक
    description: क्या बच्चे जीवित रहते हैं, अच्छी तरह बढ़ते हैं, स्कूल में बने रहते हैं और सुरक्षित हैं।
    inspired_by: UNICEF बाल कल्याण रिपोर्ट कार्ड
    method: "बराबर भार वाले चार आयाम: जीवन (शिशु और 5 वर्ष से कम आयु में मृत्यु दर), पोषण और स्वास्थ्य (ठिगनापन, पूर्ण टीकाकरण, छोटे बच्चों में एनीमिया), शिक्षा (माध्यमिक स्तर पर पढ़ाई छोड़ना), और संरक्षण (बाल विवाह, बच्चों के विरुद्ध अपराध)।"
    dimensions: {Education: शिक्षा, Nutrition and health: पोषण और स्वास्थ्य, Protection: संरक्षण, Survival: जीवन}
