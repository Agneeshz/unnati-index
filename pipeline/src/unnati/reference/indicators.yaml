- id: sex-ratio-at-birth
  name: Sex ratio at birth
  description: Girls born per 1,000 boys (three-year SRS average).
  unit: girls per 1,000 boys
  direction: higher_better
  category: inclusion
  pillar: inclusion
  dataset: rgi_srs
  frequency: annual
  decimals: 0
  target: 950
  caveat: The natural sex ratio at birth is about 950 girls per 1,000 boys, so values above that are not "better".
  valid_min: 700
  valid_max: 1100
- id: sex-ratio-at-birth-nfhs
  name: Sex ratio at birth (NFHS)
  description: Girls per 1,000 boys among children born in the five years before the survey (NFHS); covers every state and UT.
  unit: girls per 1,000 boys
  direction: higher_better
  category: inclusion
  dataset: nfhs
  frequency: irregular
  decimals: 0
  target: 950
  caveat: Survey estimate with wide margins in small states and UTs. SRS figures are preferred where SRS publishes them.
  valid_min: 600
  valid_max: 1300
- id: female-lfpr
  name: Female labour force participation
  description: Share of women aged 15+ who are working or looking for work, usual status (PS+SS), calendar year (PLFS).
  unit: "%"
  direction: higher_better
