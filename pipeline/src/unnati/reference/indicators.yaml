- id: consumption-gini
  name: Consumption inequality (Gini)
  description: Average of the rural and urban Gini coefficients of monthly per-capita consumption expenditure (HCES); 0 is perfect equality.
  unit: index (0–1)
  direction: lower_better
  category: inclusion
  pillar: inclusion
  dataset: mospi_hces
  frequency: irregular
  decimals: 3
  derived: unweighted mean of consumption-gini-rural and consumption-gini-urban
  caveat: MoSPI publishes rural and urban Gini separately; this average is not a Gini for the whole state, since it leaves out the gap between rural and urban consumption.
  valid_min: 0
