# --- Environment ----------------------------------------------------------------------------
- id: swachh-survekshan-score
  name: Swachh Survekshan cleanliness score
  description: Total score in Swachh Survekshan, the national urban cleanliness survey, out of 12,500 (the survey's assessment out of 10,000, plus garbage-free city star rating and open-defecation-free certification). Cities of 3 lakh people or more.
  unit: points (of 12,500)
  direction: higher_better
  category: environment
  dataset: swachh_survekshan
  frequency: annual
  decimals: 0
  caveat: Past top performers (Indore, Surat, Navi Mumbai and others) are in the Super Swachh League, assessed separately without a score. West Bengal's cities are not in the 2024-25 report. Totals are as published; a few, such as Ludhiana's, do not equal the sum of their parts in the report.
  valid_min: 0
  valid_max: 12500
- id: swachh-super-league
  name: Swachh Survekshan Super Swachh League
  description: Cities that ranked in the top three of their category at least once in the last three years and stayed in its top 20%; they are assessed separately and not ranked.
  unit: member
  direction: neutral
  category: environment
  dataset: swachh_survekshan
  frequency: annual
  decimals: 0
  rankable: false
  valid_min: 0
  valid_max: 1
- id: aqi-daily-mean
  name: Average air quality index (daily)
  description: Average of the day's AQI (24-hour average at 4 PM) across the state's cities in CPCB's daily bulletin.
  unit: AQI
  direction: lower_better
  category: environment
  dataset: cpcb_aqi_bulletin
  frequency: daily
  decimals: 0
  caveat: Reflects monitored cities only; many districts have no continuous monitoring station.
  valid_min: 0
  valid_max: 500
- id: pm25-annual
  name: Annual PM2.5 concentration
  description: Annual average PM2.5 in the state's monitored cities (continuous monitors where a city has them, otherwise manual stations), averaged across cities.
  unit: µg/m³
  direction: lower_better
  category: environment
  pillar: environment
  dataset: mospi_envstats
  frequency: annual
  decimals: 0
  target: 40
  derived: mean over monitored cities of each city's annual PM2.5
  caveat: Covers monitored cities only, so a state with one monitored town is judged on that town. The national standard is 40 µg/m³ a year; WHO's guideline is 5.
  valid_min: 0
  valid_max: 1000
- id: forest-cover-change
  name: Change in forest cover
  description: Change in forest cover area since the previous India State of Forest Report.
  unit: "%"
  direction: higher_better
  category: environment
  pillar: environment
  dataset: rbi_hsis
  frequency: biennial
  decimals: 2
  valid_min: -100
  valid_max: 500
- id: renewable-share-capacity
  name: Renewable share of power capacity
  description: Grid-interactive renewable capacity (solar, wind, small hydro, bio-power; excluding large hydro) as a share of installed power capacity.
  unit: "% of capacity"
  direction: higher_better
  category: environment
  pillar: environment
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  caveat: Depends partly on natural resources (sun, wind, rivers), not only on policy.
  valid_min: 0
  valid_max: 100
- id: groundwater-extraction-stage
  name: Groundwater extraction stage
  description: Annual groundwater extraction as a share of extractable groundwater resources.
  unit: "%"
  direction: lower_better
  category: environment
  pillar: environment
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  target: 70
  valid_min: 0
  valid_max: 500
- id: waste-processed
  name: Urban solid waste processed
