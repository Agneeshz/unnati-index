# Indicator catalogue. `pillar` marks membership of the Unnati Index composite (methodology v1);
# goalposts are set per methodology version once enough data is loaded (Phase 2).
# Ranked indicators are always rates, shares or per-person values, never raw totals.
#
# direction: higher_better | lower_better | neutral
# target:    official national/SDG target where one exists (used as the "best" goalpost)

# --- Demographics (context, denominators) -------------------------------------------------
- id: population
  name: Population
  description: Projected mid-year population.
  unit: persons
  direction: neutral
  category: demographics
  dataset: population_projections
  frequency: annual
  decimals: 0
  rankable: false
  valid_min: 0
- id: population-working-age
  name: Working-age population (15–59)
  description: Projected mid-year population aged 15–59.
  unit: persons
  direction: neutral
  category: demographics
  dataset: population_projections
  frequency: annual
  decimals: 0
  rankable: false
  valid_min: 0
- id: total-fertility-rate
  name: Total fertility rate
  description: Average number of children a woman would have over her lifetime at current age-specific fertility rates.
  unit: children per woman
  direction: neutral
  category: demographics
  dataset: rgi_srs
  frequency: annual
  decimals: 1
  rankable: false
  valid_min: 0
  valid_max: 10

# --- Economy & Jobs -------------------------------------------------------------------------
- id: gsdp-current
  name: Gross State Domestic Product (current prices)
  description: Value of all goods and services produced in the state, at current prices.
  unit: ₹ crore
  direction: neutral
  category: economy
  dataset: mospi_nas_state
  frequency: annual
  decimals: 0
  rankable: false
  valid_min: 0
- id: gsdp-constant
  name: Gross State Domestic Product (constant prices)
  description: Real GSDP at constant prices of the base year.
  unit: ₹ crore
  direction: neutral
  category: economy
  dataset: mospi_nas_state
  frequency: annual
  decimals: 0
  rankable: false
  valid_min: 0
  caveat: Base-year revisions create series breaks; values from different base years are never mixed.
- id: per-capita-nsdp-constant
  name: Per-capita income (real)
  description: Per-capita Net State Domestic Product at constant prices.
  unit: ₹
  direction: higher_better
  category: economy
  pillar: economy-jobs
  dataset: mospi_nas_state
  frequency: annual
  decimals: 0
  scale: log
  valid_min: 0
- id: per-capita-nsdp-current
  name: Per-capita income (current prices)
  description: Per-capita Net State Domestic Product at current prices.
  unit: ₹
  direction: higher_better
  category: economy
  dataset: mospi_nas_state
  frequency: annual
  decimals: 0
  caveat: Not adjusted for inflation; use the constant-price series to compare over time.
  valid_min: 0
- id: gsdp-growth-real
  name: Real GSDP growth
  description: Annual growth of Gross State Domestic Product at constant prices.
  unit: "%"
  direction: higher_better
  category: economy
  dataset: mospi_nas_state
  frequency: annual
  decimals: 1
  valid_min: -50
  valid_max: 50
- id: gsdp-growth-real-3yr
  name: Real GSDP growth (3-year average)
  description: Average annual growth of real GSDP over the latest three years.
  unit: "%"
  direction: higher_better
  category: economy
  pillar: economy-jobs
  dataset: mospi_nas_state
  frequency: annual
  decimals: 1
  derived: mean of the last three year-on-year changes in gsdp-constant
  valid_min: -50
  valid_max: 50
- id: cpi-inflation
  name: Retail inflation (CPI, combined)
  description: Year-on-year change in the Consumer Price Index (rural + urban).
  unit: "%"
  direction: neutral
  category: economy
  dataset: mospi_cpi_state
  frequency: monthly
  decimals: 1
  rankable: false
  valid_min: -20
  valid_max: 50
- id: unemployment-rate
  name: Unemployment rate
  description: Share of the labour force (age 15+) without work, usual status (PS+SS), calendar year (PLFS).
  unit: "%"
  direction: lower_better
  category: jobs
  pillar: economy-jobs
  dataset: mospi_plfs_state
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 100
- id: youth-unemployment-rate
  name: Youth unemployment rate
  description: Share of the labour force aged 15-29 without work, usual status (PS+SS), calendar year (PLFS).
  unit: "%"
  direction: lower_better
  category: jobs
  dataset: mospi_plfs_state
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 100
- id: lfpr
  name: Labour force participation rate
  description: Share of people aged 15+ who are working or looking for work, usual status (PS+SS), calendar year (PLFS).
  unit: "%"
  direction: higher_better
  category: jobs
  dataset: mospi_plfs_state
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 100
- id: epfo-net-payroll-per-1000
  name: New formal jobs per 1,000 working-age people
  description: Net additions to EPFO payroll over the year per 1,000 people aged 15–59.
  unit: per 1,000 working-age people
  direction: higher_better
  category: jobs
  dataset: epfo_payroll
  frequency: annual
  decimals: 1
  derived: sum of 12 months of epfo-net-payroll / population-working-age * 1000
  caveat: Counts formal-sector enrolments only; establishments register where they are headquartered, which can over-count some states.
- id: regular-wage-share
  name: Workers in regular salaried jobs
  description: Share of workers (usual status) in regular wage or salaried employment, rather than self-employment or casual labour.
  unit: "% of workers"
  direction: higher_better
  category: jobs
  pillar: economy-jobs
  dataset: mospi_plfs_state
  frequency: annual
  decimals: 1
  caveat: Regular jobs are not always good jobs; PLFS also reports that many regular employees lack a written contract or social security.
  valid_min: 0
  valid_max: 100
- id: mpce-rural
  name: Monthly per-capita consumption (rural)
  description: Average monthly per-capita consumption expenditure of rural households (HCES).
  unit: ₹ per month
  direction: higher_better
  category: jobs
  dataset: mospi_hces
  frequency: irregular
  decimals: 0
  valid_min: 0
- id: mpce-urban
  name: Monthly per-capita consumption (urban)
  description: Average monthly per-capita consumption expenditure of urban households (HCES).
  unit: ₹ per month
  direction: higher_better
  category: jobs
  dataset: mospi_hces
  frequency: irregular
  decimals: 0
  valid_min: 0

# --- Trade ----------------------------------------------------------------------------------
- id: merchandise-exports
  name: Merchandise exports
  description: Value of goods exported, by state of origin.
  unit: US$ million
  direction: neutral
  category: trade
  dataset: dgcis_state_trade
  frequency: monthly
  decimals: 0
  rankable: false
  valid_min: 0
- id: exports-per-capita
  name: Merchandise exports per person
  description: Annual merchandise exports by state of origin divided by population.
  unit: US$ per person
  direction: higher_better
  category: trade
  pillar: economy-jobs
  dataset: rbi_hsis
  frequency: annual
  decimals: 0
  scale: log
  derived: merchandise-exports (12 months) * 1e6 / population
  caveat: State of origin is as declared in shipping bills. Services exports are not published by state.
  valid_min: 0
- id: merchandise-exports-growth
  name: Merchandise export growth
  description: Year-on-year growth in merchandise exports by state of origin.
  unit: "%"
  direction: higher_better
  category: trade
  dataset: dgcis_state_trade
  frequency: monthly
  decimals: 1
  derived: year-on-year change in merchandise-exports
- id: merchandise-imports
  name: Merchandise imports
  description: Value of goods imported, by state as recorded by DGCI&S.
  unit: US$ million
  direction: neutral
  category: trade
  dataset: dgcis_state_trade
  frequency: monthly
  decimals: 0
  rankable: false
  valid_min: 0
  caveat: State attribution of imports is incomplete; DGCI&S flags it as a known data-quality limitation.

# --- Business -------------------------------------------------------------------------------
- id: gst-collection-per-capita
  name: GST collected per person
  description: State GST revenue (SGST plus the SGST share of IGST settled to the state) in the fiscal year to date, per person.
  unit: ₹ per person
  direction: higher_better
  category: business
  dataset: gstn_state_collections
  frequency: annual
  decimals: 0
  derived: sum of monthly gst collections / population
  valid_min: 0
- id: gst-collection-growth
  name: GST collection growth
  description: Growth in state GST revenue (post-settlement SGST) in the fiscal year to date over the same months of the previous year.
  unit: "%"
  direction: higher_better
  category: business
  dataset: gstn_state_collections
  frequency: monthly
  decimals: 1
- id: digital-payments-per-capita
  name: Digital payments per person (PhonePe)
  description: PhonePe transactions in the latest four quarters divided by population.
  unit: transactions per person per year
  direction: higher_better
  category: digital
  dataset: phonepe_pulse
  frequency: quarterly
  decimals: 0
  derived: sum of 4 quarters of phonepe transactions / population
  caveat: Covers one payments app only; its market share varies by state, so treat as a proxy.
  valid_min: 0

# --- Public finance -------------------------------------------------------------------------
- id: fiscal-deficit-pct-gsdp
  name: Fiscal deficit
  description: Gross fiscal deficit of the state government as a share of GSDP.
  unit: "% of GSDP"
  direction: lower_better
  category: public-finance
  pillar: governance-fiscal
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  target: 3
  valid_min: -20
  valid_max: 40
- id: debt-pct-gsdp
  name: Outstanding debt
  description: Outstanding liabilities of the state government as a share of GSDP.
  unit: "% of GSDP"
  direction: lower_better
  category: public-finance
  pillar: governance-fiscal
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  target: 20
  valid_min: 0
  valid_max: 200
- id: own-tax-revenue-pct-gsdp
  name: Own tax revenue
  description: The state's own tax revenue as a share of GSDP.
  unit: "% of GSDP"
  direction: higher_better
  category: public-finance
  pillar: governance-fiscal
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 50
- id: municipal-own-revenue-share
  name: Municipal self-reliance
  description: Share of municipal corporations' revenue that they raise themselves (property and other own taxes, fees and user charges) rather than receive as grants and assigned revenue from the state.
  unit: "% of revenue receipts"
  direction: higher_better
  category: public-finance
  dataset: rbi_municipal_finances
  frequency: annual
  decimals: 0
  caveat: Covers municipal corporations only, not smaller municipalities, totalled by state; RBI publishes no figures for individual cities. Revised estimates are provisional.
  valid_min: 0
  valid_max: 100
- id: capex-share
  name: Capital expenditure share
  description: Capital outlay as a share of total state expenditure.
  unit: "% of expenditure"
  direction: higher_better
  category: public-finance
  pillar: governance-fiscal
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 100

# --- Governance & justice -------------------------------------------------------------------
- id: court-cases-pending-over-5y
  name: Court cases pending over 5 years
  description: Share of pending cases in district and subordinate courts that are more than five years old.
  unit: "% of pending cases"
  direction: lower_better
  category: governance
  pillar: safety-justice
  dataset: njdg_pendency
  frequency: daily
  decimals: 1
  valid_min: 0
  valid_max: 100
- id: police-vacancy
  name: Police vacancy rate
  description: Share of sanctioned police posts that are vacant.
  unit: "% of sanctioned posts"
  direction: lower_better
  category: governance
  pillar: safety-justice
  dataset: bprd_dopo
  frequency: annual
  decimals: 1
  caveat: State police only (civil, district armed reserve, armed police and IRB), as on 1 January. Below zero means more personnel than sanctioned posts.
  valid_min: -100
  valid_max: 100

# --- Crime & safety -------------------------------------------------------------------------
- id: murder-rate
  name: Murder rate
  description: Murders registered per lakh population.
  unit: per lakh population
  direction: lower_better
  category: crime
  pillar: safety-justice
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  caveat: Used in the composite because murder is the crime least affected by under-reporting.
  valid_min: 0
- id: crime-rate-total
  name: Total cognisable crime rate
  description: Cognisable crimes registered (IPC/BNS and special & local laws) per lakh population.
  unit: per lakh population
  direction: lower_better
  category: crime
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  caveat: Registered crime depends on how easily people can report it. A higher rate can reflect better reporting rather than more crime.
  valid_min: 0
- id: crimes-against-women-rate
  name: Crimes against women
  description: Crimes against women registered per lakh female population.
  unit: per lakh women
  direction: lower_better
  category: crime
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  caveat: Registered crime depends on how easily people can report it. A higher rate can reflect better reporting rather than more crime.
  valid_min: 0
- id: crimes-against-children-rate
  name: Crimes against children
  description: Crimes against children registered per lakh child population.
  unit: per lakh children
  direction: lower_better
  category: crime
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  caveat: Registered crime depends on how easily people can report it. A higher rate can reflect better reporting rather than more crime. NCRB divides by the 2011 Census child population, so the rate drifts where the number of children has grown or fallen since then.
  valid_min: 0
- id: cybercrime-rate
  name: Cybercrime rate
  description: Cybercrimes registered per lakh population.
  unit: per lakh population
  direction: lower_better
  category: crime
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  caveat: Registered crime depends on how easily people can report it. A higher rate can reflect better reporting rather than more crime.
  valid_min: 0
- id: conviction-rate
  name: Conviction rate
  description: Share of IPC/BNS trials completed in the year that ended in conviction.
  unit: "%"
  direction: higher_better
  category: crime
  pillar: safety-justice
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 100
- id: trial-pendency
  name: Criminal trials pending
  description: IPC/BNS cases still pending trial at the end of the year, as a share of all cases before the courts for trial that year.
  unit: "%"
  direction: lower_better
  category: governance
  pillar: safety-justice
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  caveat: Measures the backlog of criminal trials only, not civil cases.
  valid_min: 0
  valid_max: 100
- id: chargesheeting-rate
  name: Charge-sheeting rate
  description: Share of IPC/BNS cases disposed of by police in which a charge-sheet was filed.
  unit: "%"
  direction: higher_better
  category: crime
  dataset: ncrb_cii
  frequency: annual
  decimals: 1
  valid_min: 0
  valid_max: 100
- id: air-passengers-per-100
  name: Air passengers per 100 people
  description: Passengers (arriving and departing, domestic and international) at the state's airports per 100 residents per year.
  unit: per 100 people per year
  direction: higher_better
  category: infrastructure
  dataset: aai_traffic
  frequency: monthly
  decimals: 1
  scale: log
  caveat: Counts traffic handled at the state's airports, so hubs serving neighbouring states and tourists (Delhi, Goa) read far higher than residents actually fly.
  valid_min: 0
- id: vehicles-per-1000
  name: Registered motor vehicles per 1,000 people
  description: Motor vehicles registered (transport and non-transport) per 1,000 people.
  unit: per 1,000 people
  direction: neutral
  category: infrastructure
  dataset: mospi_envstats
  frequency: annual
  decimals: 0
  rankable: false
  caveat: Registrations accumulate and old vehicles are rarely removed, so this overstates vehicles on the road.
  valid_min: 0
- id: road-density
  name: Road density
  description: Length of all roads (national and state highways, district, rural, urban and project roads) per 100 km² of area.
  unit: km per 100 km²
  direction: higher_better
  category: infrastructure
  dataset: rbi_hsis
  frequency: annual
  decimals: 0
  scale: log
  caveat: Not computed for Jammu & Kashmir and Ladakh, whose official area includes territory India claims but does not administer. Small, urban UTs (Delhi, Chandigarh) read far higher than states.
  valid_min: 0
- id: national-highway-density
  name: National highway density
  description: Length of national highways per 1,000 km² of area.
  unit: km per 1,000 km²
  direction: higher_better
  category: infrastructure
  dataset: rbi_hsis
  frequency: annual
  decimals: 0
  scale: log
  caveat: Not computed for Jammu & Kashmir and Ladakh, whose official area includes territory India claims but does not administer. Small, urban UTs (Delhi, Chandigarh) read far higher than states.
  valid_min: 0
- id: state-highway-density
  name: State highway density
  description: Length of state highways per 1,000 km² of area.
  unit: km per 1,000 km²
  direction: higher_better
  category: infrastructure
  dataset: rbi_hsis
  frequency: annual
  decimals: 0
  scale: log
  caveat: Not computed for Jammu & Kashmir and Ladakh, whose official area includes territory India claims but does not administer. Small, urban UTs (Delhi, Chandigarh) read far higher than states.
  valid_min: 0
- id: rail-route-density
  name: Railway route density
  description: Length of railway route per 1,000 km² of area.
  unit: km per 1,000 km²
  direction: higher_better
  category: infrastructure
  dataset: rbi_hsis
  frequency: annual
  decimals: 1
  scale: log
  caveat: Not computed for Jammu & Kashmir and Ladakh, whose official area includes territory India claims but does not administer. Small, urban UTs (Delhi, Chandigarh) read far higher than states.
  valid_min: 0
- id: road-deaths-per-lakh
  name: Road accident deaths
  description: Deaths in road accidents per lakh population.
  unit: per lakh population
  direction: lower_better
  category: crime
  pillar: safety-justice
  dataset: morth_road_accidents
  frequency: annual
  decimals: 1
  valid_min: 0
- id: suicide-rate
  name: Suicide rate
  description: Suicides per lakh population.
  unit: per lakh population
  direction: lower_better
  category: crime
  dataset: ncrb_adsi
  frequency: annual
  decimals: 1
  valid_min: 0

