name: Ingest

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily: check every enabled dataset for new releases
    - cron: "0 2 * * 1" # 07:30 IST Mondays: office-holders
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PYTHONIOENCODING: utf-8

jobs:
  datasets:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *'
    name: Dataset ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - mospi_nas_state
          - mospi_plfs_state
          - mospi_cpi_state
          - mospi_nfhs
          - udise_plus
          - aishe
          - mospi_hces
          - ncrb_cii
          - ncrb_adsi
          - morth_road_accidents
          - population_projections
          - rgi_srs
          - rgi_srs_mmr
          - rgi_srs_life_tables
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run unnati ingest ${{ matrix.dataset }} --trigger schedule
      - name: Report the failure as an issue
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Data source failing: ${{ matrix.dataset }}"

  officials:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1'
    name: Office-holders
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run unnati officials sync
      - run: uv run unnati officials observe
      - name: Report the failure as an issue
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Data source failing: office-holders"
