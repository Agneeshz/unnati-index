name: Ingest

on:
  schedule:
    - cron: "30 1 * * *" # 07:00 IST daily: check every enabled dataset for new releases
    - cron: "0 2 * * 1" # 07:30 IST Mondays: office-holders
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

env:
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PYTHONIOENCODING: utf-8

jobs:
  datasets:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *'
    name: Dataset ${{ matrix.dataset }}
    runs-on: ubuntu-latest
    # One unreachable source must not fail the whole refresh: the health job below turns every
    # failing or stale source into a GitHub issue (with the error) and closes it on recovery.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        dataset:
          - mospi_nas_state
          - mospi_plfs_state
          - mospi_cpi_state
          - mospi_nfhs
          - udise_plus
          - aishe
          - mospi_hces
          - mospi_envstats
          - cpcb_aqi_bulletin
          - phonepe_pulse
          - gstn_state_collections
          - jjm_tap_water
          - aai_traffic
          - swachh_survekshan
          - rbi_municipal_finances
          - ncrb_cii
          - ncrb_adsi
          - morth_road_accidents
          - population_projections
          - rgi_srs
          - rgi_srs_mmr
          - rgi_srs_life_tables
          - trai_subscriptions
          - bprd_dopo
          - rbi_hsis
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run unnati ingest ${{ matrix.dataset }} --trigger schedule

  score:
    # Recompute the Unnati Index after the refresh, even if some sources failed.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *')
    needs: datasets
    name: Unnati Index scores
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - name: Check published figures (docs/verification.yaml)
        run: uv run unnati verify
      - run: uv run unnati score
      - name: Refresh the website's cached pages
        run: uv run unnati revalidate
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      - name: Report the failure as an issue
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Scoring failed"

  health:
    # Failing (latest run failed, was rejected or died) and stale (no new data for 1.5x the
    # usual release interval) sources: open or update an issue each, close recovered ones.
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '30 1 * * *')
    needs: [datasets, score]
    name: Source health
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run unnati health --issues
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  officials:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 2 * * 1'
    name: Office-holders
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uv sync --locked
      - run: uv run unnati officials sync
      - run: uv run unnati officials observe
      - run: uv run unnati revalidate officials
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
      - name: Report the failure as an issue
        if: failure()
        uses: ./.github/actions/report-failure
        with:
          title: "Data source failing: office-holders"
