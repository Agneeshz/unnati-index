name: Backup

# Weekly dump of the production database, kept as a workflow artifact for 90 days. Each dump is
# restored into a scratch Postgres first, so a backup that cannot be restored fails loudly.
# Restore: download the artifact, then `pg_restore --no-owner --no-privileges -d <url> unnati.dump`.
on:
  schedule:
    - cron: "30 21 * * 0" # Sundays 03:00 IST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    services:
      scratch:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: scratch
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Install pg_dump 18 (must match the server's major version)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
      - name: Dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: /usr/lib/postgresql/18/bin/pg_dump --format=custom --no-owner --no-privileges -f unnati.dump "$DATABASE_URL"
      - name: Test restore
        env:
          SCRATCH: postgresql://postgres:scratch@localhost:5432/postgres
        run: |
          /usr/lib/postgresql/18/bin/pg_restore --no-owner --no-privileges --exit-on-error -d "$SCRATCH" unnati.dump
          rows=$(/usr/lib/postgresql/18/bin/psql "$SCRATCH" -tAc "select count(*) from observation")
          echo "restored $rows observations ($(du -h unnati.dump | cut -f1))"
          test "$rows" -gt 10000
      - uses: actions/upload-artifact@v7
        with:
          name: unnati-db-${{ github.run_number }}
          path: unnati.dump
          retention-days: 90
          compression-level: 0 # custom-format dumps are already compressed
